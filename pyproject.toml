[project]
name = "bhasha-mitra"
version = "1.0.0"
description = "Offline AI Video Translation Platform"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Bhasha Mitra Team" }
]

dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

addopts = "-v"

[tool.black]

line-length = 88

[tool.isort]

profile = "black"