<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Set new password - {{ app_name }}</title><link rel="icon" href="/static/logo.png" type="image/png" /><link rel="stylesheet" href="/static/style.css" /></head>
<body class="centered"><main class="login-layout"><form class="card login-card" method="post" action="/forgot-password/reset">
<img src="/static/logo.png" alt="{{ app_name }}" class="login-logo" /><h1>Set new password</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<label>New password<input type="password" name="new_password" required autocomplete="new-password" /></label>
<label>Confirm new password<input type="password" name="confirm_password" required autocomplete="new-password" /></label>
<button type="submit">Set password</button>
</form></main></body></html>
