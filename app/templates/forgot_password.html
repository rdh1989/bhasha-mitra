<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Forgot password - {{ app_name }}</title><link rel="icon" href="/static/logo.png" type="image/png" /><link rel="stylesheet" href="/static/style.css" /></head>
<body class="centered"><main class="login-layout"><form class="card login-card" method="post" action="{% if questions %}/forgot-password/verify{% else %}/forgot-password{% endif %}">
<img src="/static/logo.png" alt="{{ app_name }}" class="login-logo" /><h1>Forgot password</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}{% if message %}<p class="muted" role="status">{{ message }}</p>{% endif %}
{% if questions %}
<p class="muted">Answer your recovery questions to continue.</p>
{% for question in questions %}<label>{{ question }}<input type="password" name="answer_{{ loop.index }}" required autocomplete="off" /></label>{% endfor %}
<button type="submit">Verify answers</button>
{% else %}
<label>Username<input type="text" name="username" required autocomplete="username" /></label>
<button type="submit">Continue</button>
{% endif %}
<p class="muted"><a href="/login">Back to sign in</a></p>
</form></main></body></html>
