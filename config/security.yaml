security:

  authentication:
    enabled: true
    session_timeout_hours: 8
    remember_me_days: 30
    database: data/bhasha_mitra.db

  authorization:
    enabled: false

  cors:

    enabled: true

    allow_origins:
      - "*"

    allow_methods:
      - "*"

    allow_headers:
      - "*"

  rate_limit:

    enabled: false

  api_keys:

    enabled: false

  encryption:

    enabled: false

  csrf:

    enabled: false