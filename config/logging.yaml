logging:

  level: INFO

  console:

    enabled: true

  application:

    enabled: true
    filename: application.log

  error:

    enabled: true
    filename: error.log

  jobs:

    enabled: true
    filename: jobs.log

  ai:

    enabled: true
    filename: ai.log

  rotation:

    max_size_mb: 10
    backup_count: 5

  directory: storage/logs

  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

  date_format: "%Y-%m-%d %H:%M:%S"