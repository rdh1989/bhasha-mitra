<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | {{ app_name }}</title>

    <link rel="icon"
          type="image/x-icon"
          href="{{ url_for('static', path='images/favicon.ico') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/login.css') }}">
</head>

<body class="login-body">

    <main class="login-page">

        <!-- Bhasha Mitra watermark -->
        <div class="login-watermark" aria-hidden="true"></div>

        <section class="login-panel" aria-label="Login">

            <div class="login-card">

                <div class="login-brand">
                    <img
                        src="{{ url_for('static', path='images/logo.png') }}"
                        alt="{{ app_name }}"
                        class="login-logo">
                </div>

                <h2>Welcome Back</h2>

                <p class="login-subtitle">
                    Please login to your account
                </p>

                {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST"
                      action="/login"
                      class="login-form">

                    <div class="input-group">

                        <label for="username">Username</label>

                        <div class="input-control">
                            <i class="fas fa-user input-icon" aria-hidden="true"></i>
                            <input
                                id="username"
                                type="text"
                                name="username"
                                value="{{ username | default('') }}"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required
                                autofocus>
                        </div>

                    </div>

                    <div class="input-group">

                        <label for="password">Password</label>

                        <div class="input-control">
                            <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                            <input
                                id="password"
                                type="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required>

                            <i
                                id="togglePassword"
                                class="fas fa-eye password-toggle"
                                role="button"
                                tabindex="0"
                                aria-label="Show password"></i>
                        </div>

                    </div>

                    <div class="login-options">

                        <label class="checkbox">
                            <input
                                type="checkbox"
                                name="remember_me">
                            <span>Remember Me</span>
                        </label>

                        <a href="#" class="forgot-password">
                            Forgot Password?
                        </a>

                    </div>

                    <button
                        id="loginSubmit"
                        type="submit"
                        name="submit"
                        value="login"
                        class="login-button">

                        <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
                        <span>Login</span>

                    </button>

                </form>


            </div>

        </section>

    </main>

    <script>
        const togglePassword = document.getElementById("togglePassword");
        const password = document.getElementById("password");
        const loginForm = document.querySelector(".login-form");
        const loginSubmit = document.getElementById("loginSubmit");

        function togglePasswordVisibility() {
            if (!password || !togglePassword) {
                return;
            }

            const isPassword = password.type === "password";
            password.type = isPassword ? "text" : "password";

            togglePassword.classList.toggle("fa-eye", !isPassword);
            togglePassword.classList.toggle("fa-eye-slash", isPassword);
            togglePassword.setAttribute(
                "aria-label",
                isPassword ? "Hide password" : "Show password"
            );
        }

        if (togglePassword) {
            togglePassword.addEventListener("click", togglePasswordVisibility);

            togglePassword.addEventListener("keydown", (event) => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    togglePasswordVisibility();
                }
            });
        }

        if (loginForm && loginSubmit) {
            loginForm.addEventListener("submit", () => {
                loginSubmit.disabled = true;
                loginSubmit.innerHTML =
                    '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i><span>Signing in...</span>';
            });
        }
    </script>

</body>
</html>
